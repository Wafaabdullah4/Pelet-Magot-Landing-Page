<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website dengan Scrollbar Kustom</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            height: 200vh; /* Untuk memperlihatkan scrollbar */
        }
        .container {
            width: 80%;
            margin: auto;
            background: white;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
        }
        /* Scrollbar Kustom */
        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: #f4f4f4;
            border-radius: 5px;
        }
        ::-webkit-scrollbar-thumb {
            background: #9c2ddd;
            border-radius: 5px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #9c2ddd;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Selamat Datang di Website Saya</h1>
        <p>Ini adalah contoh website sederhana dengan scrollbar yang telah dikustomisasi.</p>
    </div>
</body>
</html>
